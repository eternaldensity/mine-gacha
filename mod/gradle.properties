# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment parameter names and javadoc (https://parchmentmc.org/docs/getting-started).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The pack pins NeoForge 21.1.247 (pack_lock.json / reports/runtime_compat.md).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.247
neo_version_range=[21.1.0,)
loader_version_range=[4,)

## Mod properties. mod_id is the gacha namespace used by the datapack and GLMs.

mod_id=gacha
mod_name=Chaos Gacha
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=dev.eternaldensity.gacha
mod_authors=eternaldensity
mod_description=The Chaos Gacha mechanics for the modpack: tickets, the machine, curses, feats and the Power Score.
